<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSLR Photo Booth</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>📷 DSLR Photo Booth</h1>
            <div class="connection-status">
                <span id="connection-status">未连接</span>
                <button id="connect-btn" class="btn btn-primary">连接相机</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - Preview and Controls -->
            <div class="left-panel">
                <div class="preview-container">
                    <canvas id="preview-canvas"></canvas>
                    <div id="countdown-overlay" class="countdown-overlay hidden">
                        <span id="countdown-number">3</span>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <button id="capture-btn" class="btn btn-large btn-success" disabled>
                            📸 拍照
                        </button>
                        <button id="countdown-btn" class="btn btn-large btn-info" disabled>
                            ⏱️ 倒计时拍照
                        </button>
                    </div>

                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="preview-toggle" disabled>
                            实时预览
                        </label>
                        <label>
                            倒计时: 
                            <input type="number" id="countdown-seconds" value="3" min="1" max="10">
                            秒
                        </label>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Filters and Layers -->
            <div class="right-panel">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="filters">滤镜</button>
                    <button class="tab-btn" data-tab="layers">图层</button>
                    <button class="tab-btn" data-tab="gallery">相册</button>
                </div>

                <!-- Filters Tab -->
                <div id="filters-tab" class="tab-content active">
                    <h3>图片滤镜</h3>
                    <div class="filter-controls">
                        <div class="filter-item">
                            <label>亮度</label>
                            <input type="range" id="brightness" min="0" max="200" value="100">
                            <span id="brightness-value">100%</span>
                        </div>
                        <div class="filter-item">
                            <label>对比度</label>
                            <input type="range" id="contrast" min="0" max="200" value="100">
                            <span id="contrast-value">100%</span>
                        </div>
                        <div class="filter-item">
                            <label>饱和度</label>
                            <input type="range" id="saturation" min="0" max="200" value="100">
                            <span id="saturation-value">100%</span>
                        </div>
                        <div class="filter-item">
                            <label>模糊</label>
                            <input type="range" id="blur" min="0" max="10" value="0">
                            <span id="blur-value">0px</span>
                        </div>
                        <div class="filter-item">
                            <label>灰度</label>
                            <input type="range" id="grayscale" min="0" max="100" value="0">
                            <span id="grayscale-value">0%</span>
                        </div>
                        <div class="filter-item">
                            <label>棕褐色</label>
                            <input type="range" id="sepia" min="0" max="100" value="0">
                            <span id="sepia-value">0%</span>
                        </div>
                    </div>
                    <div class="button-group">
                        <button id="reset-filters-btn" class="btn btn-secondary">重置滤镜</button>
                        <button id="apply-filters-btn" class="btn btn-primary">应用滤镜</button>
                    </div>
                </div>

                <!-- Layers Tab -->
                <div id="layers-tab" class="tab-content">
                    <h3>图层管理</h3>
                    <div class="layer-controls">
                        <button id="load-template-btn" class="btn btn-primary">加载模板</button>
                        <button id="save-template-btn" class="btn btn-secondary">保存模板</button>
                        <button id="add-text-layer-btn" class="btn btn-info">添加文字</button>
                        <button id="clear-layers-btn" class="btn btn-danger">清除图层</button>
                    </div>
                    <div id="layers-list" class="layers-list">
                        <!-- Layers will be dynamically added here -->
                    </div>
                    <div class="template-info">
                        <p>💡 提示：加载图片模板后，拍摄的照片会自动放置在模板上</p>
                    </div>
                </div>

                <!-- Gallery Tab -->
                <div id="gallery-tab" class="tab-content">
                    <h3>照片相册</h3>
                    <div class="gallery-controls">
                        <button id="refresh-gallery-btn" class="btn btn-secondary">刷新</button>
                    </div>
                    <div id="gallery-grid" class="gallery-grid">
                        <!-- Gallery images will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Action Bar -->
        <div class="action-bar">
            <button id="save-btn" class="btn btn-success" disabled>💾 保存照片</button>
            <button id="print-btn" class="btn btn-primary" disabled>🖨️ 打印照片</button>
            <span id="status-message" class="status-message"></span>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
